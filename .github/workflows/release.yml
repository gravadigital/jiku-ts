#           # oldest section in the file has no heading after it and would otherwise swallow it.
#           #
#           # index(), not a regex: the heading contains `[` and `]`, and matching it as a pattern
#           # would read them as a character class and silently produce nothing.
#           awk -v v="## [$TAG]" '
#             index($0, v) == 1 {found = 1; next}
#             found && (/^## / || /^\[[^]]+\]: /) {exit}
#             found {print}
#           ' CHANGELOG.md \
#             | sed -e '/./,$!d' \
#             | tac | sed -e '/./,$!d' | tac > notes.md
