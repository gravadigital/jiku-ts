# A throwaway NATS for the integration tests.
#
# It is NOT how Jiku's bus is configured: there is no operator mode, no accounts and no auth
# callout here, so anything may connect and no permission is enforced. That is deliberate — these
# tests exercise the PROTOCOL layer (subjects, inbox, envelopes, cursors), and running the real
# authentication chain is `live.test.ts`'s job.
#
#   npm run nats:up
#   npm run test:integration
#   npm run nats:down

port: 4322
http: 8323

# The WebSocket listener is what makes the browser half of this package testable at all. The
# real deployment has one too, with TLS on the same certificate as the TCP port.
websocket {
  port: 8322
  no_tls: true
}
